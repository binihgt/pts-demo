{% extends "base.html" %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center py-5">
    <div class="col-12 col-md-6">
        <i class="bi bi-shield-x text-danger display-1 mb-3"></i>
        <h2 class="fw-bold">403 - Access Forbidden</h2>
        <p class="text-muted mb-4">
            You do not have administrative permission to view this resource.
        </p>
        <a href="{{ url_for('dashboard.overview') }}" class="btn btn-primary px-4">
            <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
