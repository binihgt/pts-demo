{% extends "base.html" %}

{% block title %}Request Error (400){% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center py-5">
    <div class="col-12 col-md-6">
        <i class="bi bi-exclamation-triangle text-warning display-1 mb-3"></i>
        <h2 class="fw-bold">400 - Bad Request</h2>
        <p class="text-muted mb-4">
            The submitted form or request was invalid or could not be processed.
        </p>
        <a href="{{ url_for('dashboard.overview') }}" class="btn btn-primary px-4">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
