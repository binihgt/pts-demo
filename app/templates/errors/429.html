{% extends "base.html" %}

{% block title %}Too Many Requests (429){% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center text-center py-5">
    <div class="col-12 col-md-6">
        <i class="bi bi-hourglass-bottom text-warning display-1 mb-3"></i>
        <h2 class="fw-bold">429 - Rate Limit Exceeded</h2>
        <p class="text-muted mb-4">
            You have sent too many requests in a short period. Please wait a minute and try again.
        </p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4">
            Try Again
        </a>
    </div>
</div>
{% endblock %}
