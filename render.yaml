services:
  - type: web
    name: pts-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FLASK_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pts-demo-db
          property: connectionString
      - key: PUBLIC_URL
        value: https://pts-demo.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        value: pts_demo_secret_2026_webhook

databases:
  - name: pts-demo-db
    databaseName: pts_demo
    user: pts_user
    plan: free
